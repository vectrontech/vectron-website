  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ndor + generic library parts shipped<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"stat\" data-reveal=\"\">\n        <div class=\"stat__num\">181<\u002Fdiv>\n        <div class=\"stat__lbl\">Tests in the cascade-math suite<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"stat\" data-reveal=\"\">\n        <div class=\"stat__num\">&lt;200<span class=\"stat__num-unit\">ms<\u002Fspan><\u002Fdiv>\n        <div class=\"stat__lbl\">Recompute on a 12-node chain<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"stat\" data-reveal=\"\">\n        <div class=\"stat__num\">0<\u002Fdiv>\n        <div class=\"stat__lbl\">Phone-home calls. Ever.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"section\" id=\"features\" aria-labelledby=\"features-title\">\n  <div class=\"container\">\n    <header class=\"section__header\">\n      <p class=\"eyebrow\">What's inside<\u002Fp>\n      <h2 id=\"features-title\">Built for how RF engineers actually work.<\u002Fh2>\n      <p class=\"section__sub\">\n<\u002Fp>\n    <\u002Fheader>\n    <div class=\"grid grid--3 grid--gap-lg\">\n      <article class=\"card\" data-reveal=\"\">\n        <div class=\"card__icon\" aria-hidden=\"true\">\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <rect x=\"3\" y=\"9\" width=\"4\" height=\"6\" rx=\"1\"><\u002Frect><path d=\"M7 12h3\"><\u002Fpath>\n            <path d=\"M10 9 14 12 10 15Z\" fill=\"currentColor\" fill-opacity=\"0.15\"><\u002Fpath>\n            <path d=\"M14 12h3\"><\u002Fpath><circle cx=\"19\" cy=\"12\" r=\"2\"><\u002Fcircle><path d=\"M18 11l2 2M18 13l2-2\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <h3>Schematic chain editor<\u002Fh3>\n        <p>Drag components, snap wires, watch the cascade re-solve as you go. Group sub-assemblies, tab between Tx / Rx / Cal / LO paths, route on a 20-px grid.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"card\" data-reveal=\"\">\n        <div class=\"card__icon\" aria-hidden=\"true\">\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <path d=\"M4 6h7v12H4zM13 6h7v12h-7z\"><\u002Fpath>\n            <path d=\"M6 9h3M6 12h3M6 15h2M15 9h3M15 12h3M15 15h2\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <h3>Real component library<\u002Fh3>\n        <p>Vendor parts from Quinstar, Mini-Circuits, Marki, RFLambda, PMI, Junkosha, MicroCoax, Keysight — plus generic templates you swap to anything per-instance.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"card\" data-reveal=\"\">\n        <div class=\"card__icon\" aria-hidden=\"true\">\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <path d=\"M3 18h2L8 6l4 12 3-8 2 5h4\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <h3>Cascaded gain, NF, P1dB<\u002Fh3>\n        <p>Friis noise figure, P1dB compression and link gain rolled up stage-by-stage, per frequency point. The numbers update as you edit — no spreadsheet to re-number.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"card\" data-reveal=\"\">\n        <div class=\"card__icon\" aria-hidden=\"true\">\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <circle cx=\"8\" cy=\"12\" r=\"3\"><\u002Fcircle><line x1=\"6.2\" y1=\"10.2\" x2=\"9.8\" y2=\"13.8\"><\u002Fline><line x1=\"6.2\" y1=\"13.8\" x2=\"9.8\" y2=\"10.2\"><\u002Fline>\n            <path d=\"M5 12H2M11 12h3\"><\u002Fpath>\n            <circle cx=\"18\" cy=\"12\" r=\"3\"><\u002Fcircle><line x1=\"16.2\" y1=\"10.2\" x2=\"19.8\" y2=\"13.8\"><\u002Fline><line x1=\"16.2\" y1=\"13.8\" x2=\"19.8\" y2=\"10.2\"><\u002Fline>\n            <path d=\"M8 15v3M18 15v3\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <h3>Multi-stage downconverters<\u002Fh3>\n        <p>IFBand-driven LO tracking, per-mixer LO chain budgets, fixed-IF sweep mode. PNA-X style two-stage chains are first-class, not an afterthought.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"card\" data-reveal=\"\">\n        <div class=\"card__icon\" aria-hidden=\"true\">\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <path d=\"M12 21 L4 17 L4 7 L12 3 L20 7 L20 17 Z\"><\u002Fpath>\n            <path d=\"M2 12 L4 12 M20 12 L22 12 M12 22 L12 24 M12 0 L12 2\"><\u002Fpath>\n            <path d=\"M6 10 Q9 8 12 10 T18 10\"><\u002Fpath>\n            <path d=\"M6 14 Q9 12 12 14 T18 14\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <h3>OTA &amp; antenna-pattern math<\u002Fh3>\n        <p>Free-space FSPL, range-dependent power density, EIRP, min DUT gain to hit a target SNR. Spec direction (≤ / ≥) is configurable per row.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"card\" data-reveal=\"\">\n        <div class=\"card__icon\" aria-hidden=\"true\">\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"><\u002Frect>\n            <line x1=\"3\" y1=\"9\" x2=\"21\" y2=\"9\"><\u002Fline>\n            <line x1=\"7\" y1=\"13\" x2=\"17\" y2=\"13\"><\u002Fline>\n            <line x1=\"7\" y1=\"16\" x2=\"13\" y2=\"16\"><\u002Fline>\n            <rect x=\"14.5\" y=\"14.5\" width=\"4.5\" height=\"3\" fill=\"currentColor\" fill-opacity=\"0.2\"><\u002Frect>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <h3>xlsx that doesn't suck<\u002Fh3>\n        <p>Per-type fills, IF1 / IF2 / RF input blocks, conditional formatting on SNR margin. The spreadsheet your program manager will actually open without complaining.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"card\" data-reveal=\"\">\n        <div class=\"card__icon\" aria-hidden=\"true\">\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <path d=\"M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z\"><\u002Fpath>\n            <path d=\"M14 3v6h6\"><\u002Fpath>\n            <text x=\"7\" y=\"17\" font-size=\"6\" font-family=\"monospace\" fill=\"currentColor\" stroke=\"none\" font-weight=\"700\">PDF<\u002Ftext>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <h3>Customer-ready PDF reports<\u002Fh3>\n        <p>Cover, schematic, chain table, spec summary, plots, LO budget, BOM. Pick the sheets, hit export. Done in a customer-facing test plan.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"card\" data-reveal=\"\">\n        <div class=\"card__icon\" aria-hidden=\"true\">\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <rect x=\"4\" y=\"10\" width=\"16\" height=\"10\" rx=\"2\"><\u002Frect>\n            <path d=\"M8 10V7a4 4 0 0 1 8 0v3\"><\u002Fpath>\n            <circle cx=\"12\" cy=\"15\" r=\"1.5\" fill=\"currentColor\"><\u002Fcircle>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <h3>Offline-licensed<\u002Fh3>\n        <p>Ed25519-signed keys verified locally. Zero phone-home. Air-gapped engineering networks work the same as anything else — no IT exception required.<\u002Fp>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"section\" id=\"workflow\" aria-labelledby=\"workflow-title\">\n  <div class=\"container\">\n    <header class=\"section__header\">\n      <p class=\"eyebrow\">How it works<\u002Fp>\n      <h2 id=\"workflow-title\">Four steps from blank canvas to PDF.<\u002Fh2>\n    <\u002Fheader>\n    <ol class=\"workflow\" data-reveal=\"\">\n      <li class=\"workflow__step\">\n        <h3>Pick a template<\u002Fh3>\n        <p>Start blank or from a wired template — Ka VNA, Ku radar, satcom uplink, anechoic chamber. Bands and IFBands ship pre-set.<\u002Fp>\n      <\u002Fli>\n      <li class=\"workflow__step\">\n        <h3>Drop &amp; wire<\u002Fh3>\n        <p>Drag library parts onto the canvas. Snap-route wires on a 20-px grid. Tab between Tx, Rx, Cal, and LO paths.<\u002Fp>\n      <\u002Fli>\n      <li class=\"workflow__step\">\n        <h3>Tune in real time<\u002Fh3>\n        <p>Override any parameter per-instance. The cascade re-solves in under 200 ms — gain, NF, EIRP, SNR margin, all at once.<\u002Fp>\n      <\u002Fli>\n      <li class=\"workflow__step\">\n        <h3>Ship the report<\u002Fh3>\n        <p>Export xlsx for the spreadsheet crowd, PDF for customers. Both include the schematic, chain table, plots, and BOM.<\u002Fp>\n      <\u002Fli>\n    <\u002Fol>\n\n    <div class=\"vendors\" data-reveal=\"\">\n      <p class=\"vendors__label\">Vendor parts shipped in the library<\u002Fp>\n      <div class=\"vendors__list\">\n        <span>Keysight<\u002Fspan>\n        <span>Mini-Circuits<\u002Fspan>\n        <span>Quinstar<\u002Fspan>\n        <span>RFLambda<\u002Fspan>\n        <span>PMI<\u002Fspan>\n        <span>Marki<\u002Fspan>\n        <span>Krytar<\u002Fspan>\n        <span>Junkosha<\u002Fspan>\n        <span>MicroCoax<\u002Fspan>\n        <span>KOAXIS<\u002Fspan>\n        <span>Qorvo<\u002Fspan>\n        <span>MVG<\u002Fspan>\n        <span>Bird<\u002Fspan>\n        <span>Pasternack<\u002Fspan>\n        <span>+ your own<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"section section--alt\" id=\"screens\" aria-labelledby=\"screens-title\">\n  <div class=\"container\">\n    <header class=\"section__header\">\n      <p class=\"eyebrow\">In the app<\u002Fp>\n      <h2 id=\"screens-title\">Four screens. One source of truth.<\u002Fh2>\n      <p class=\"section__sub\">Click through to see what shipping work looks like.<\u002Fp>\n    <\u002Fheader>\n    <div class=\"tabs\" data-tabs=\"\">\n      <div class=\"tabs__bar\" role=\"tablist\" aria-label=\"Screenshot views\">\n        <button class=\"tabs__tab is-active\" role=\"tab\" aria-selected=\"true\" aria-controls=\"tab-editor\" id=\"tabbtn-editor\">Chain editor<\u002Fbutton>\n        <button class=\"tabs__tab\" role=\"tab\" aria-selected=\"false\" aria-controls=\"tab-library\" id=\"tabbtn-library\">Templates<\u002Fbutton>\n        <button class=\"tabs__tab\" role=\"tab\" aria-selected=\"false\" aria-controls=\"tab-results\" id=\"tabbtn-results\">PXI composer<\u002Fbutton>\n        <button class=\"tabs__tab\" role=\"tab\" aria-selected=\"false\" aria-controls=\"tab-export\" id=\"tabbtn-export\">PDF report<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"tabs__panels\">\n        <div class=\"tabs__panel is-active\" role=\"tabpanel\" id=\"tab-editor\" aria-labelledby=\"tabbtn-editor\">\n          <div class=\"shot-frame\">\n            <div class=\"shot-frame__chrome\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fdiv>\n            <div class=\"shot-frame__body shot-frame__body--svg\" id=\"il-editor\"><\u002Fdiv>\n            <div class=\"shot-frame__caption\">Concept · schematic editor with live chain table<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"tabs__panel\" role=\"tabpanel\" id=\"tab-library\" aria-labelledby=\"tabbtn-library\" hidden=\"\">\n          <div class=\"shot-frame\">\n            <div class=\"shot-frame__chrome\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fdiv>\n            <div class=\"shot-frame__body shot-frame__body--svg\">\n              <svg viewBox=\"0 0 800 500\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Project templa \">\n        <summary>How does licensing work?<\u002Fsummary>\n        <div class=\"accordion__body\">\n          <p>A license is a non-transferable right to install and run RF TrueLink on the seats you've paid for. One seat = one engineer. You can install on as many machines as you want for that engineer (laptop + desktop + build host) — no extra charge. Keys are signed by Vectron's private key and verified offline by the app. There is no phone-home.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"accordion__item\">\n        <summary>Does the app need internet access?<\u002Fsummary>\n        <div class=\"accordion__body\">\n          <p>No. License verification is fully offline. The app never connects to Vectron's servers during normal operation. You can run it on an air-gapped engineering network without asking IT for an exception.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"accordion__item\">\n        <summary>What platforms are supported?<\u002Fsummary>\n        <div class=\"accordion__body\">\n          <p>macOS (signed <code>.app<\u002Fcode> bundle, Apple Silicon and Intel) and Windows (signed <code>.exe<\u002Fcode> installer, 64-bit) are both available. Linux is on the table once there's enough demand to justify the QA cycle.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"accordion__item\">\n        <summary>What's the refund policy?<\u002Fsummary>\n        <div class=\"accordion__body\">\n          <p><strong>Subscription tiers:<\u002Fstrong> full refund within 7 days of first purchase if the tool doesn't work for you. After 7 days the subscription continues until you cancel — no partial-period refunds. <strong>Perpetual:<\u002Fstrong> full refund within 14 days of purchase.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"accordion__item\">\n        <summary>Can I use it for commercial work?<\u002Fsummary>\n        <div class=\"accordion__body\">\n          <p>Yes — every tier (Personal, Enterprise, Perpetual) includes commercial use. The full EULA is bundled with the installer and is the binding legal document.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdetails>\n      <details class=\"accordion__item\">\n        <summary>Who builds and sells this?<\u002Fsummary>\n        <div class=\"accordion__body\">\n          <p>RF TrueLink is built and sold by <a href=\"mailto:info@vectrontechnologies.com\">Vectron Technologies LLC<\u002Fa>. Sales, support, anything else: <a href=\"mailto:info@vectrontechnologies.com\">info@vectrontechnologies.com<\u002Fa>.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdetails>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"section section--alt\" id=\"email\" aria-labelledby=\"email-title\">\n  <div class=\"container container--narrow text-center\">\n    <h2 id=\"email-title\">Get release notes in your inbox.<\u002Fh2>\n    <p>One email per release. Notes on what shipped, what broke, what's next. No marketing fluff. Unsubscribe in one click.<\u002Fp>\n    <form class=\"email-form\" action=\"#\" method=\"post\" data-email-form=\"\">\n      <label class=\"visually-hidden\" for=\"email-input\">Email address<\u002Flabel>\n      <input id=\"email-input\" type=\"email\" name=\"email\" placeholder=\"you@company.com\" required=\"\" autocomplete=\"email\">\n      <button type=\"submit\" class=\"btn btn--primary\">Subscribe<\u002Fbutton>\n    <\u002Fform>\n    <p class=\"form-status\" data-email-status=\"\" aria-live=\"polite\"><\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n\n<footer class=\"footer\">\n  <div class=\"container footer__inner\">\n    <div>\n      <svg class=\"footer__logo\" viewBox=\"0 0 1280 320\" role=\"img\" aria-label=\"RF TrueLink\"><use href=\"#rftl-logo-h\"><\u002Fuse><\u002Fsvg>\n      <p class=\"footer__copy\">Copyright (c) 2026 Vectron Technologies LLC. All rights reserved.<br>RF TrueLink — proprietary and confidential.<\u002Fp>\n    <\u002Fdiv>\n    <nav class=\"footer__nav\" aria-label=\"Footer\">\n      <a href=\"#features\">Features<\u002Fa>\n      <a href=\"#pricing\">Pricing<\u002Fa>\n      <a href=\"#download\">Download<\u002Fa>\n      <a href=\"#faq\">Docs<\u002Fa>\n      <a href=\"mailto:info@vectrontechnologies.com\">Contact<\u002Fa>\n    <\u002Fnav>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<!-- External libraries (CDN). If the artifact host blocks remote\n     scripts the page still renders — Lenis/GSAP just no-op and you\n     lose smooth-scroll + parallax. The procedural hero animation is\n     fully self-contained. -->\n<script src=\"1ec717aa-7336-45e9-83c7-99b2c0ead488\" defer=\"\"><\u002Fscript>\n<script src=\"1d2d317e-b412-4b44-a282-2b25734026dc\" defer=\"\"><\u002Fscript>\n<script src=\"77c7854d-45b2-460b-9285-80c3bd63991d\" defer=\"\"><\u002Fscript>\n\n<script defer=\"\">\n/* =============================================================\n   Lenis smooth-scroll bootstrap\n   ============================================================= */\n(function () {\n  if (typeof window === \"undefined\") return;\n  if (window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches) return;\n  function start() {\n    if (typeof Lenis !== \"function\") return setTimeout(start, 50);\n    const lenis = new Lenis({\n      lerp: 0.06,\n      smoothWheel: true,\n      smoothTouch: false,\n      wheelMultiplier: 0.9,\n      touchMultiplier: 1.1,\n    });\n    window.__lenis = lenis;\n    function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }\n    requestAnimationFrame(raf);\n    (function bridge() {\n      if (typeof gsap === \"undefined\" || typeof ScrollTrigger === \"undefined\") {\n        return setTimeout(bridge, 50);\n      }\n      gsap.registerPlugin(ScrollTrigger);\n      lenis.on(\"scroll\", ScrollTrigger.update);\n      gsap.ticker.add((time) => lenis.raf(time * 1000));\n      gsap.ticker.lagSmoothing(0);\n    })();\n  }\n  start();\n})();\n<\u002Fscript>\n\n<script defer=\"\">\n/* =============================================================\n   Hero animation — spectrum + waveform (procedural canvas)\n   ============================================================= */\n(function () {\n  const canvas = document.getElementById(\"heroCanvas\");\n  if (!canvas) return;\n  if (window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches) return;\n\n  const ctx = canvas.getContext(\"2d\", { alpha: true });\n  const dpr = Math.min(window.devicePixelRatio || 1, 2);\n\n  let cw = 0, ch = 0;\n  function resize() {\n    const rect = canvas.getBoundingClientRect();\n    const w = Math.max(1, Math.floor(rect.width  * dpr));\n    const h = Math.max(1, Math.floor(rect.height * dpr));\n    if (canvas.width !== w)  canvas.width  = w;\n    if (canvas.height !== h) canvas.height = h;\n    cw = w; ch = h;\n  }\n  requestAnimationFrame(() => { resize(); requestAnimationFrame(resize); });\n  window.addEventListener(\"load\", resize, { once: true });\n  window.addEventListener(\"resize\", resize, { passive: true });\n  if (typeof ResizeObserver === \"function\") new ResizeObserver(resize).observe(canvas);\n\n  function accentRGB() { return window.__twAccentRGB || [245, 165, 36]; }\n  function AMBER_F()   { const c = accentRGB(); return `rgba(${c[0]}, ${c[1]}, ${c[2]}, `; }\n  function AMBER_HF()  { const c = accentRGB(); return `rgba(${Math.min(255,c[0]+10)}, ${Math.min(255,c[1]+28)}, ${Math.min(255,c[2]+56)}, `; }\n  const CYAN    = \"rgba(96, 176, 240, \";\n  const WHITE   = \"rgba(255, 255, 255, \";\n\n  const BAR_COUNT = 96;\n  const bars = new Array(BAR_COUNT).fill(0).map(() => ({\n    phase: Math.random() * Math.PI * 2,\n    freq:  0.6 + Math.random() * 1.4,\n    base:  0.15 + Math.random() * 0.45,\n    peak:  0.45 + Math.random() * 0.55,\n  }));\n\n  const PARTICLE_COUNT = 28;\n  const particles = new Array(PARTICLE_COUNT).fill(0).map(() => ({\n    x: Math.random(), y: Math.random(),\n    r: 0.6 + Math.random() * 1.4,\n    vx: (Math.random() - 0.5) * 0.012,\n    vy: (Math.random() - 0.5) * 0.006,\n    alpha: 0.2 + Math.random() * 0.4,\n  }));\n\n  function waveY(x01, t, conf) {\n    return (\n      conf.A1 * Math.sin(conf.k1 * x01 * Math.PI * 2 + conf.p1 * t) +\n      conf.A2 * Math.sin(conf.k2 * x01 * Math.PI * 2 + conf.p2 * t) +\n      conf.A3 * Math.sin(conf.k3 * x01 * Math.PI * 2 + conf.p3 * t)\n    );\n  }\n  const WAVE_A = { A1: 0.55, A2: 0.30, A3: 0.18,\n                   k1: 1.4,  k2: 3.1,  k3: 6.7,\n                   p1: 0.45, p2: 0.7,  p3: 1.2 };\n  const WAVE_B = { A1: 0.40, A2: 0.22, A3: 0.10,\n                   k1: 0.9,  k2: 2.2,  k3: 5.3,\n                   p1: 0.30, p2: 0.55, p3: 0.9 };\n\n  let visible = true;\n  if (\"IntersectionObserver\" in window) {\n    new IntersectionObserver((entries) => {\n      for (const e of entries) visible = e.isIntersecting;\n    }, { threshold: 0 }).observe(canvas);\n  }\n\n  let scrollFade = 1;\n  function updateScrollFade() {\n    const hero = document.querySelector(\".hero\");\n    if (!hero) return;\n    const r = hero.getBoundingClientRect();\n    const total = r.height || 1;\n    const passed = Math.min(Math.max(-r.top / total, 0), 1);\n    scrollFade = 1 - passed * 0.85;\n  }\n  window.addEventListener(\"scroll\", updateScrollFade, { passive: true });\n  updateScrollFade();\n\n  function drawGraticule() {\n    const lines = 8;\n    ctx.save();\n    ctx.strokeStyle = WHITE + \"0.04)\";\n    ctx.lineWidth = 1;\n    for (let i = 1; i < lines; i++) {\n      const y = (ch / lines) * i;\n      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cw, y); ctx.stroke();\n    }\n    ctx.strokeStyle = WHITE + \"0.06)\";\n    ctx.beginPath(); ctx.moveTo(0, ch / 2); ctx.lineTo(cw, ch / 2); ctx.stroke();\n    ctx.restore();\n  }\n\n  function drawSpectrum(t) {\n    const baseline = ch * 0.92;\n    const maxH = ch * 0.55;\n    const bw = cw / BAR_COUNT;\n    ctx.save();\n    for (let i = 0; i < BAR_COUNT; i++) {\n      const b = bars[i];\n      const level = b.base + "background:#E879B8\" aria-label=\"Pink\"><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"tw-sec\">Motion<\u002Fdiv>\n    <div class=\"tw-row\">\n      <div class=\"tw-toggle\" id=\"tw-anim\" role=\"switch\">\n        <span style=\"font-size:12.5px;color:#EAF0FA\">Hero spectrum animation<\u002Fspan>\n        <span class=\"sw\"><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Faside>\n\n<script>\n/* =============================================================\n   Tweaks: persisted defaults + host protocol + apply\n   ============================================================= */\n(function () {\n  const TWEAKS = /*EDITMODE-BEGIN*/{\n    \"headlinePreset\": \"custom\",\n    \"headline\": \"RF link budgets\\nBridge the Gap between Visio and Excel\",\n    \"eyebrow\": \"RF TrueLink · for RF & antenna engineers\",\n    \"subhead\": \"Rapidly iterate your designs with fast, schematic-driven link-budget analysis. Drag components, swap parts, change frequencies — every cascaded number updates in real time.\\nFull Design life cycle from sketch to Bill of Materials\\n\",\n    \"ctaLabel\": \"Start free 14-day trial\",\n    \"accent\": \"#F5A524\",\n    \"heroAnim\": true\n  }/*EDITMODE-END*/;\n\n  const PRESETS = {\n    a: \"RF link budgets without\\nthe Visio-and-Excel.\",\n    b: \"Bridge the Visio\\nand Excel gap.\",\n    c: \"Your RF chain,\\nas a live model.\",\n    d: \"Stop retyping gains\\ninto spreadsheets.\",\n  };\n\n  // Derive amber-hi / amber-lo tints from the chosen accent.\n  function tint(hex, amt) {\n    const n = parseInt(hex.slice(1), 16);\n    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;\n    r = Math.round(r + (255 - r) * amt);\n    g = Math.round(g + (255 - g) * amt);\n    b = Math.round(b + (255 - b) * amt);\n    return \"#\" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);\n  }\n  function shade(hex, amt) {\n    const n = parseInt(hex.slice(1), 16);\n    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;\n    r = Math.round(r * (1 - amt)); g = Math.round(g * (1 - amt)); b = Math.round(b * (1 - amt));\n    return \"#\" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);\n  }\n  function hexToRgb(hex) {\n    const n = parseInt(hex.slice(1), 16);\n    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];\n  }\n\n  const $ = (id) => document.getElementById(id);\n\n  function apply(t) {\n    // Headline\n    const hl = t.headlinePreset && t.headlinePreset !== \"custom\"\n      ? PRESETS[t.headlinePreset] : t.headline;\n    const titleEl = $(\"hero-title\");\n    if (titleEl) titleEl.innerHTML = (hl || \"\").split(\"\\n\")\n      .map((l) => l.replace(/&/g, \"&amp;\").replace(/<\u002Fg, \"&lt;\"))\n      .join(\"<br/>\");\n    const eb = $(\"tw-eyebrow\"); if (eb) eb.textContent = t.eyebrow;\n    const sub = $(\"tw-sub\"); if (sub) sub.textContent = t.subhead;\n    const cta = $(\"tw-cta\"); if (cta) cta.textContent = t.ctaLabel;\n\n    // Accent — rewrite the brand tokens + the hero canvas amber.\n    const root = document.documentElement.style;\n    root.setProperty(\"--c-accent\", t.accent);\n    root.setProperty(\"--c-accent-hi\", tint(t.accent, 0.28));\n    root.setProperty(\"--c-accent-lo\", shade(t.accent, 0.28));\n    const [r, g, b] = hexToRgb(t.accent);\n    root.setProperty(\"--sh-glow-amber\",\n      `0 0 0 1px rgba(${r},${g},${b},0.35), 0 12px 40px rgba(${r},${g},${b},0.22)`);\n    window.__twAccentRGB = [r, g, b];\n\n    // Hero animation on/off\n    const canvas = $(\"heroCanvas\");\n    if (canvas) canvas.style.display = t.heroAnim ? \"\" : \"none\";\n    window.__twHeroAnim = !!t.heroAnim;\n  }\n\n  // ---- host protocol ----\n  function setTweak(key, val) {\n    const edits = typeof key === \"object\" ? key : { [key]: val };\n    Object.assign(TWEAKS, edits);\n    apply(TWEAKS);\n    try { window.parent.postMessage({ type: \"__edit_mode_set_keys\", edits }, \"*\"); } catch (e) {}\n  }\n\n  const panel = $(\"tw-panel\");\n  window.addEventListener(\"message\", (e) => {\n    const ty = e && e.data && e.data.type;\n    if (ty === \"__activate_edit_mode\") panel.classList.add(\"is-open\");\n    else if (ty === \"__deactivate_edit_mode\") panel.classList.remove(\"is-open\");\n  });\n  try { window.parent.postMessage({ type: \"__edit_mode_available\" }, \"*\"); } catch (e) {}\n\n  $(\"tw-close\").addEventListener(\"click\", () => {\n    panel.classList.remove(\"is-open\");\n    try { window.parent.postMessage({ type: \"__edit_mode_dismissed\" }, \"*\"); } catch (e) {}\n  });\n\n  // ---- bind controls ----\n  function initControls() {\n    $(\"tw-headline-preset\").value = TWEAKS.headlinePreset;\n    $(\"tw-headline\").value = TWEAKS.headline;\n    $(\"tw-eyebrow-i\").value = TWEAKS.eyebrow;\n    $(\"tw-sub-i\").value = TWEAKS.subhead;\n    $(\"tw-cta-i\").value = TWEAKS.ctaLabel;\n    document.querySelectorAll(\"#tw-accent .tw-swatch\").forEach((s) =>\n      s.setAttribute(\"aria-pressed\", s.dataset.c.toLowerCase() === TWEAKS.accent.toLowerCase() ? \"true\" : \"false\"));\n    $(\"tw-anim\").setAttribute(\"aria-pressed\", TWEAKS.heroAnim ? \"true\" : \"false\");\n\n    $(\"tw-headline-preset\").addEventListener(\"change\", (e) => {\n      const v = e.target.value;\n      if (v !== \"custom\") { $(\"tw-headline\").value = PRESETS[v]; setTweak({ headlinePreset: v, headline: PRESETS[v] }); }\n      else setTweak(\"headlinePreset\", \"custom\");\n    });\n    $(\"tw-headline\").addEventListener(\"input\", (e) =>\n      setTweak({ headline: e.target.value, headlinePreset: \"custom\" }));\n    $(\"tw-headline\").addEventListener(\"input\", () => { $(\"tw-headline-preset\").value = \"custom\"; });\n    $(\"tw-eyebrow-i\").addEventListener(\"input\", (e) => setTweak(\"eyebrow\", e.target.value));\n    $(\"tw-sub-i\").addEventListener(\"input\", (e) => setTweak(\"subhead\", e.target.value));\n    $(\"tw-cta-i\").addEventListener(\"input\", (e) => setTweak(\"ctaLabel\", e.target.value));\n    document.querySelectorAll(\"#tw-accent .tw-swatch\").forEach((s) =>\n      s.addEventListener(\"click\", () => {\n        document.querySelectorAll(\"#tw-accent .tw-swatch\").forEach((o) => o.setAttribute(\"aria-pressed\", \"false\"));\n        s.setAttribute(\"aria-pressed\", \"true\");\n        setTweak(\"accent\", s.dataset.c);\n      }));\n    const anim = $(\"tw-anim\");\n    anim.addEventListener(\"click\", () => {\n      const on = anim.getAttribute(\"aria-pressed\") !== \"true\";\n      anim.setAttribute(\"aria-pressed\", on ? \"true\" : \"false\");\n      setTweak(\"heroAnim\", on);\n    });\n  }\n\n  // ---- draggable panel ----\n  (function drag() {\n    const handle = $(\"tw-drag\");\n    let sx, sy, ox, oy, active = false;\n    handle.addEventListener(\"pointerdown\", (e) => {\n      if (e.target.closest(\"button\")) return;\n      active = true; sx = e.clientX; sy = e.clientY;\n      const r = panel.getBoundingClientRect();\n      ox = r.left; oy = r.top;\n      handle.setPointerCapture(e.pointerId);\n    });\n    handle.addEventListener(\"pointermove\", (e) => {\n      if (!active) return;\n      const nx = ox + (e.clientX - sx), ny = oy + (e.clientY - sy);\n      panel.style.left = nx + \"px\"; panel.style.top = ny + \"px\";\n      panel.style.right = \"auto\"; panel.style.bottom = \"auto\";\n    });\n    handle.addEventListener(\"pointerup\", () => { active = false; });\n  })();\n\n  apply(TWEAKS);\n  initControls();\n})();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
  <!-- Inject the live demo into the "Chain editor" tab after the bundler unpacks -->
  <script>
  (function injectDemo(){
    // Wait for the bundler to finish replacing the DOM
    function waitForTabs(){
      const tabs=document.querySelectorAll('[role="tab"]');
      if(!tabs.length) return setTimeout(waitForTabs,200);
      // Find the "Chain editor" tab + panel
      let editorTab=null, editorPanel=null;
      tabs.forEach(t=>{if(t.textContent.trim()==='Chain editor'){editorTab=t;}});
      if(!editorTab) return setTimeout(waitForTabs,200);
      const panelId=editorTab.getAttribute('aria-controls');
      editorPanel=panelId?document.getElementById(panelId):null;
      if(!editorPanel) return;
      // Replace the empty screenshot mockup with the live demo iframe
      editorPanel.innerHTML=`
        <iframe src="/demo/" style="width:100%;height:680px;border:none;border-radius:8px;background:#fafafa;"
          title="RFTrueLink interactive demo" loading="lazy" allow="clipboard-write"></iframe>
        <p style="text-align:center;padding:8px 0;font-size:12px;color:#888;">
          Drag components, wire ports, edit the chain table — this is a live mini version of RFTrueLink running in your browser.
        </p>`;
      // Add a "Link Budget" tab that shows just the chain table (the demo's lower panel)
      // by scrolling the iframe or pointing to a separate view — for now, the single
      // iframe shows everything (canvas + table) so no separate tab is needed.
      // Optionally rename the tab
      editorTab.textContent='Interactive demo';
    }
    waitForTabs();
  })();
  </script>
